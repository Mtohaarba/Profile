<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Access</title>
<style>
  :root{
    --bg:#000a05; --fg:#39ff6a; --dim:#1f7a3d; --red:#ff3b3b; --warn:#ffd23b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--fg);
    font-family:'Courier New', monospace;
    padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    min-height:100%; overflow-x:hidden; position:relative;
  }
  #matrix{position:fixed; inset:0; z-index:0; opacity:.25;}
  #ui{position:relative; z-index:1; max-width:700px; margin:0 auto;}
  h1{font-size:1.1rem; letter-spacing:1px; color:var(--red); text-shadow:0 0 8px var(--red); margin-bottom:10px; animation:flicker 2.5s infinite;}
  @keyframes flicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1} 20%,24%,55%{opacity:.5}}
  #term{
    background:rgba(0,20,8,.85); border:1px solid var(--dim); border-radius:6px;
    padding:14px; min-height:260px; font-size:.82rem; line-height:1.5;
    box-shadow:0 0 20px rgba(57,255,106,.15) inset; white-space:pre-wrap; word-break:break-word;
  }
  .line{opacity:0; animation:appear .15s forwards;}
  @keyframes appear{to{opacity:1}}
  .cursor{display:inline-block; width:8px; background:var(--fg); animation:blink 1s step-end infinite;}
  @keyframes blink{50%{opacity:0}}
  .bar-wrap{margin:10px 0; font-size:.78rem;}
  .bar-outer{background:#07220f; border:1px solid var(--dim); border-radius:4px; height:14px; overflow:hidden; margin-top:4px;}
  .bar-inner{height:100%; width:0%; background:linear-gradient(90deg,var(--dim),var(--fg)); transition:width .3s linear;}
  #cam-wrap{position:relative; margin:10px 0; border:1px solid var(--red); border-radius:6px; overflow:hidden; max-width:260px; display:none; box-shadow:0 0 14px rgba(255,59,59,.4);}
  #cam-video{width:100%; display:block; filter:grayscale(.3) contrast(1.15) brightness(.9) hue-rotate(60deg);}
  #cam-overlay{position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(57,255,106,.06) 0px, rgba(57,255,106,.06) 1px, transparent 2px, transparent 4px);}
  #cam-rec{position:absolute; top:6px; left:6px; font-size:.65rem; color:var(--red); display:flex; align-items:center; gap:4px;}
  #cam-rec .dot{width:7px; height:7px; border-radius:50%; background:var(--red); animation:blink 1s step-end infinite;}
  #cam-crosshair{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:.5;}
  #cam-crosshair::before,#cam-crosshair::after{content:''; position:absolute; background:var(--red);}
  #cam-crosshair::before{width:40px; height:1px;}
  #cam-crosshair::after{width:1px; height:40px;}
  button{
    background:transparent; border:1px solid var(--fg); color:var(--fg);
    font-family:inherit; padding:10px 18px; border-radius:4px; font-size:.85rem;
    cursor:pointer; margin-top:10px;
  }
  button:hover{background:var(--fg); color:#000;}
  #freeze-overlay{position:fixed; inset:0; z-index:9998; background:transparent; cursor:default; display:block; touch-action:none; pointer-events:auto; -webkit-user-select:none; user-select:none;}
  #escape-zone{position:fixed; top:0; left:0; width:70px; height:70px; z-index:9999; display:block; touch-action:none;}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="freeze-overlay" oncontextmenu="return false;"></div>
<div id="escape-zone"></div>
<div id="ui">
  <h1>⚠ PERINGATAN: AKSES TIDAK SAH TERDETEKSI</h1>
  <div id="term"></div>
  <div id="cam-wrap">
    <video id="cam-video" autoplay playsinline muted></video>
    <div id="cam-overlay"></div>
    <div id="cam-crosshair"></div>
    <div id="cam-rec"><span class="dot"></span>LIVE</div>
  </div>
</div>

<script>
const term = document.getElementById('term');
let cancelled = false;

const lines = [
  {t:"Menginisialisasi koneksi jarak jauh...", d:400},
  {t:"Alamat IP target: " + fakeIP(), d:500},
  {t:"Melewati firewall... [BERHASIL]", d:600},
  {t:"Memindai port terbuka: 21, 22, 80, 443...", d:700},
  {t:"Payload terdeteksi: RedLocker.exe", d:500},
  {t:"Menginstal malware ke sistem...", bar:true, d:1600},
  {t:"Mengaktifkan modul ransomware...", d:500},
  {t:"Mengakses webcam...", cam:true, d:500},
  {t:"Mengunci berkas pribadi (.jpg .docx .mp4 .pdf)...", bar:true, d:1800},
  {t:"Mengenkripsi partisi disk...", bar:true, d:1600},
  {t:"Menghapus shadow copy & titik pemulihan...", bar:true, d:1200},
  {t:"Menyebarkan payload ke jaringan lokal...", bar:true, d:1400},
  {t:"Menulis catatan tebusan ke setiap folder...", d:600},
];

function fakeIP(){
  const r=()=>Math.floor(Math.random()*255);
  return `${r()}.${r()}.${r()}.${r()}`;
}

async function typeLine(text){
  return new Promise(res=>{
    const div = document.createElement('div');
    div.className='line';
    term.appendChild(div);
    let i=0;
    const iv = setInterval(()=>{
      if(cancelled){clearInterval(iv); res(); return;}
      div.textContent = text.slice(0,i) + (i<text.length? '▌':'');
      i++;
      term.scrollTop = term.scrollHeight;
      if(i>text.length){clearInterval(iv); div.textContent=text; res();}
    }, 14);
  });
}

async function runBar(duration){
  return new Promise(res=>{
    const wrap=document.createElement('div'); wrap.className='bar-wrap';
    const outer=document.createElement('div'); outer.className='bar-outer';
    const inner=document.createElement('div'); inner.className='bar-inner';
    outer.appendChild(inner); wrap.appendChild(outer); term.appendChild(wrap);
    let p=0;
    const step = 100/(duration/60);
    const iv=setInterval(()=>{
      if(cancelled){clearInterval(iv); res(); return;}
      p+=step; if(p>=100){p=100; inner.style.width='100%'; clearInterval(iv); setTimeout(res,150); return;}
      inner.style.width=p+'%';
    },60);
  });
}

let escTaps=0, escTimer=null;
function armFreeze(){
  document.getElementById('freeze-overlay').style.display='block';
  const ez=document.getElementById('escape-zone');
  ez.style.display='block';
  ez.onclick=(e)=>{
    e.stopPropagation();
    escTaps++;
    clearTimeout(escTimer);
    escTimer=setTimeout(()=>{escTaps=0;},1200);
    if(escTaps>=5){disarmFreeze(); escTaps=0;}
  };
}
function disarmFreeze(){
  document.getElementById('freeze-overlay').style.display='none';
  document.getElementById('escape-zone').style.display='none';
  cancelled = true;
  closeCam();
  term.innerHTML='';
}
// arm immediately on load, before anything else can be tapped
armFreeze();

let camStream=null;
async function openCam(){
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false});
    const vid=document.getElementById('cam-video');
    vid.srcObject=camStream;
    document.getElementById('cam-wrap').style.display='block';
    await new Promise(r=>setTimeout(r,2500));
  }catch(err){
    await typeLine("[gagal akses kamera: izin ditolak]");
  }
}
function closeCam(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  document.getElementById('cam-wrap').style.display='none';
}

async function sequence(){
  armFreeze();
  for(const l of lines){
    if(cancelled) break;
    await typeLine(l.t);
    if(l.bar) await runBar(l.d);
    else if(l.cam) await openCam();
    else await new Promise(r=>setTimeout(r,l.d));
  }
  closeCam();
  if(cancelled){ closeCam(); return; }
  await glitchLoop();
}

const hexChars='0123456789ABCDEF';
function randHex(len){ let s=''; for(let i=0;i<len;i++) s+=hexChars[Math.floor(Math.random()*16)]; return s; }
function randGibberish(){
  const kinds=[
    ()=>`0x${randHex(8)}  MOV  [${randHex(4)}], AX  ; inject`,
    ()=>`[ENC] block_${randHex(6)} -> locked`,
    ()=>`proc_${Math.floor(Math.random()*9000+1000)}.dll loaded @0x${randHex(6)}`,
    ()=>`scanning ${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)} ...`,
    ()=>`key_fragment[${Math.floor(Math.random()*64)}] = ${randHex(16)}`,
  ];
  return kinds[Math.floor(Math.random()*kinds.length)]();
}
async function glitchLoop(){
  while(!cancelled){
    const div=document.createElement('div');
    div.className='line';
    div.style.color = Math.random()>0.85 ? 'var(--red)' : 'var(--dim)';
    div.textContent = randGibberish();
    term.appendChild(div);
    term.scrollTop = term.scrollHeight;
    while(term.children.length>60) term.removeChild(term.firstChild);
    await new Promise(r=>setTimeout(r, 70+Math.random()*120));
  }
}

sequence();

// matrix rain background
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=window.innerWidth; canvas.height=window.innerHeight;}
resize(); window.addEventListener('resize', resize);
const chars = "01アイウエオカキクケコサシスセソ";
const fontSize=14;
let columns, drops;
function setup(){
  columns = Math.floor(canvas.width/fontSize);
  drops = Array(columns).fill(1);
}
setup();
function draw(){
  ctx.fillStyle='rgba(0,10,5,0.08)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#39ff6a';
  ctx.font=fontSize+'px monospace';
  for(let i=0;i<drops.length;i++){
    const text = chars[Math.floor(Math.random()*chars.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw, 50);
</script>
</body>
</html>
